<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog Trust Layer Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 50px;
        }
        
        .section h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1em;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        thead {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        
        th {
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tbody tr {
            transition: background-color 0.2s ease;
        }
        
        tbody tr:hover {
            background-color: #f9f9f9;
        }
        
        /* Color coding for actions */
        .action-allow {
            background-color: #f0fdf4;
            border-left: 4px solid #10b981;
        }
        
        .action-allow-with-warning {
            background-color: #fffbeb;
            border-left: 4px solid #f59e0b;
        }
        
        .action-review {
            background-color: #fed7aa;
            border-left: 4px solid #f97316;
        }
        
        .action-block {
            background-color: #fee2e2;
            border-left: 4px solid #dc2626;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .status-verified {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status-flagged {
            background: #fee2e2;
            color: #7f1d1d;
        }
        
        .action-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }
        
        .action-allow {
            background: #10b981;
        }
        
        .action-allow-with-warning {
            background: #f59e0b;
        }
        
        .action-review {
            background: #f97316;
        }
        
        .action-block {
            background: #dc2626;
        }
        
        .test-case-badge {
            display: inline-block;
            background: #a78bfa;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: 700;
            margin-right: 8px;
            text-transform: uppercase;
        }
        
        .product-id {
            font-weight: 600;
            color: #333;
        }
        
        .trust-score {
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .trust-score.high {
            color: #10b981;
        }
        
        .trust-score.medium {
            color: #f59e0b;
        }
        
        .trust-score.low {
            color: #dc2626;
        }
        
        .reasons {
            font-size: 0.9em;
            color: #666;
            max-width: 400px;
            line-height: 1.5;
        }
        
        .reasons:empty::before {
            content: "No issues detected";
            color: #10b981;
            font-style: italic;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 8px;
        }
        
        .stat-card p {
            font-size: 0.95em;
            opacity: 0.9;
        }
        
        .timestamp-col {
            font-size: 0.85em;
            color: #666;
            font-family: 'Courier New', monospace;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔐 Catalog Trust Layer Dashboard</h1>
            <p>Real-time trust scoring and verification audit</p>
        </header>
        
        <div class="content">
            <!-- Products Section -->
            <div class="section">
                <h2>Products Trust Analysis</h2>
                
                <div id="products-stats" class="stats"></div>
                
                <div id="products-container">
                    <div class="loading">Loading products...</div>
                </div>
            </div>
            
            <!-- Audit Log Section -->
            <div class="section">
                <h2>Verification Audit Log</h2>
                
                <div id="audit-container">
                    <div class="loading">Loading audit log...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        
        // Color mapping for actions
        function getActionClass(action) {
            switch(action) {
                case 'ALLOW': return 'action-allow';
                case 'ALLOW_WITH_WARNING': return 'action-allow-with-warning';
                case 'REVIEW': return 'action-review';
                case 'BLOCK': return 'action-block';
                default: return '';
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'VERIFIED': return 'status-verified';
                case 'FLAGGED': return 'status-flagged';
                default: return '';
            }
        }
        
        function getTrustScoreClass(score) {
            if (score >= 90) return 'high';
            if (score >= 60) return 'medium';
            return 'low';
        }
        
        function formatTimestamp(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleString();
        }
        
        // Load and display products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/api/products`);
                if (!response.ok) throw new Error('Failed to load products');
                
                const products = await response.json();
                displayProducts(products);
                displayStats(products);
            } catch (error) {
                document.getElementById('products-container').innerHTML = 
                    `<div class="error">Error loading products: ${error.message}</div>`;
            }
        }
        
        function displayStats(products) {
            const stats = {
                VERIFIED: products.filter(p => p.status === 'VERIFIED').length,
                ALLOW_WITH_WARNING: products.filter(p => p.action === 'ALLOW_WITH_WARNING').length,
                REVIEW: products.filter(p => p.action === 'REVIEW').length,
                BLOCK: products.filter(p => p.action === 'BLOCK').length,
            };
            
            const statsHtml = `
                <div class="stat-card">
                    <h3>${stats.VERIFIED}</h3>
                    <p>Verified Products</p>
                </div>
                <div class="stat-card">
                    <h3>${stats.ALLOW_WITH_WARNING}</h3>
                    <p>Warnings</p>
                </div>
                <div class="stat-card">
                    <h3>${stats.REVIEW}</h3>
                    <p>Need Review</p>
                </div>
                <div class="stat-card">
                    <h3>${stats.BLOCK}</h3>
                    <p>Blocked</p>
                </div>
            `;
            
            document.getElementById('products-stats').innerHTML = statsHtml;
        }
        
        function displayProducts(products) {
            if (products.length === 0) {
                document.getElementById('products-container').innerHTML = 
                    '<div class="no-data">No products found</div>';
                return;
            }
            
            const tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>Product ID</th>
                            <th>Product Name</th>
                            <th>Trust Score</th>
                            <th>Status</th>
                            <th>Action</th>
                            <th>Reasons</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${products.map(p => `
                            <tr class="${getActionClass(p.action)}">
                                <td>
                                    <div class="product-id">
                                        ${p.is_test_case ? `<span class="test-case-badge">${p.product_id}</span>` : p.product_id}
                                    </div>
                                </td>
                                <td>${p.product_name}</td>
                                <td>
                                    <span class="trust-score ${getTrustScoreClass(p.trust_score)}">
                                        ${p.trust_score}
                                    </span>
                                </td>
                                <td>
                                    <span class="status-badge ${getStatusClass(p.status)}">
                                        ${p.status}
                                    </span>
                                </td>
                                <td>
                                    <span class="action-badge ${getActionClass(p.action)}">
                                        ${p.action}
                                    </span>
                                </td>
                                <td>
                                    <div class="reasons">
                                        ${p.reasons && p.reasons.length > 0 ? p.reasons.join('<br>') : ''}
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('products-container').innerHTML = tableHtml;
        }
        
        // Load and display audit log
        async function loadAuditLog() {
            try {
                const response = await fetch(`${API_BASE}/api/audit-log`);
                if (!response.ok) throw new Error('Failed to load audit log');
                
                const entries = await response.json();
                displayAuditLog(entries);
            } catch (error) {
                document.getElementById('audit-container').innerHTML = 
                    `<div class="error">Error loading audit log: ${error.message}</div>`;
            }
        }
        
        function displayAuditLog(entries) {
            if (entries.length === 0) {
                document.getElementById('audit-container').innerHTML = 
                    '<div class="no-data">No audit entries yet. Run some verifications to populate the log.</div>';
                return;
            }
            
            const tableHtml = `
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Product ID</th>
                            <th>Product Name</th>
                            <th>Trust Score</th>
                            <th>Action</th>
                            <th>Reasons</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${entries.map(e => `
                            <tr>
                                <td><span class="timestamp-col">${formatTimestamp(e.timestamp)}</span></td>
                                <td><strong>${e.product_id}</strong></td>
                                <td>${e.product_name}</td>
                                <td><span class="trust-score ${getTrustScoreClass(e.trust_score)}">${e.trust_score}</span></td>
                                <td>
                                    <span class="action-badge ${getActionClass(e.action)}">
                                        ${e.action}
                                    </span>
                                </td>
                                <td>
                                    <div class="reasons">
                                        ${e.reasons || 'No issues'}
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            document.getElementById('audit-container').innerHTML = tableHtml;
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            loadAuditLog();
        });
    </script>
</body>
</html>
